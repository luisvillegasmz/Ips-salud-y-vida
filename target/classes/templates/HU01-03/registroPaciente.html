<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Paciente | Salud y Vida IPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{/img/LogoSinLetras.png}" type="image/png">
</head>
<body>

<div class="login-wrapper" style="align-items: flex-start; padding-top: 2rem;">
    <div class="card-login card-wide">

        <div class="logo-area">
            <img th:src="@{/img/Logo.png}" src="/img/Logo.png" alt="Logo Salud y Vida IPS">
        </div>

        <p class="login-title">Registro de Paciente</p>
        <p class="page-subtitle-text">Complete los datos de identidad y atención del paciente</p>

        <div th:if="${exito}" class="alert-exito">
            <span th:text="${exito}"></span>
        </div>
        <div th:if="${error}" class="alert-error">
            ⚠ <span th:text="${error}"></span>
        </div>

        <form action="/pacientes/registro" method="post"
              class="grid grid-cols-1 md:grid-cols-2 gap-4"
              id="formPaciente">

            <!-- Tipo de documento -->
            <div class="col-span-1 md:col-span-2">
                <label for="tipoDocumento" class="form-label-ips">
                    Tipo de documento <span class="required">*</span>
                </label>
                <select id="tipoDocumento" name="tipoDocumento" class="select-ips" required>
                    <option value="" disabled selected>-- Seleccione --</option>
                    <option th:each="tipo : ${tiposDocumento}"
                            th:value="${tipo.codigo}"
                            th:text="${tipo.nombre}">
                    </option>
                </select>
            </div>

            <!-- Número de documento -->
            <div class="col-span-1 md:col-span-2">
                <label for="numeroDocumento" class="form-label-ips">
                    Número de documento <span class="required">*</span>
                </label>
                <input type="text" class="input-login"
                       id="numeroDocumento" name="numeroDocumento"
                       placeholder="Ej: 1023456789" required>
            </div>

            <!-- Nombres -->
            <div>
                <label for="nombres" class="form-label-ips">
                    Nombres <span class="required">*</span>
                </label>
                <input type="text" class="input-login"
                       id="nombres" name="nombres"
                       placeholder="Ej: Juan Carlos" required
                       pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]{2,80}">
            </div>

            <!-- Apellidos -->
            <div>
                <label for="apellidos" class="form-label-ips">
                    Apellidos <span class="required">*</span>
                </label>
                <input type="text" class="input-login"
                       id="apellidos" name="apellidos"
                       placeholder="Ej: Pérez Gómez" required
                       pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]{2,80}">
            </div>

            <!-- Fecha de nacimiento -->
            <div>
                <label for="fechaNacimiento" class="form-label-ips">
                    Fecha de nacimiento <span class="required">*</span>
                </label>
                <input type="date" class="input-login"
                       id="fechaNacimiento" name="fechaNacimiento" required>
            </div>

            <!-- Género -->
            <div>
                <label for="genero" class="form-label-ips">Género</label>
                <select id="genero" name="genero" class="select-ips">
                    <option value="">-- Seleccione --</option>
                    <option th:each="gen : ${generos}"
                            th:if="${gen.activo}"
                            th:value="${gen.nombre}"
                            th:text="${gen.nombre}">
                    </option>
                </select>
            </div>

            <!-- Estado civil -->
            <div>
                <label for="estadoCivil" class="form-label-ips">Estado civil</label>
                <select id="estadoCivil" name="estadoCivil" class="select-ips">
                    <option value="">-- Seleccione --</option>
                    <option th:each="estado : ${estadosCiviles}"
                            th:if="${estado.activo}"
                            th:value="${estado.nombre}"
                            th:text="${estado.nombre}">
                    </option>
                </select>
            </div>

            <!-- Departamento -->
            <div>
                <label for="deptoSelect" class="form-label-ips">Departamento</label>
                <select id="deptoSelect" name="departamento" class="select-ips"
                        onchange="filtrarMunicipios()">
                    <option value="">-- Seleccione --</option>
                    <option th:each="dep : ${departamentos}"
                            th:if="${dep.activo}"
                            th:value="${dep.nombre}"
                            th:attr="data-id=${dep.id}"
                            th:text="${dep.nombre}">
                    </option>
                </select>
            </div>

            <!-- Municipio (filtrado por departamento con JS) -->
            <div>
                <label for="muniSelect" class="form-label-ips">Municipio</label>
                <select id="muniSelect" name="municipio" class="select-ips">
                    <option value="">-- Seleccione departamento primero --</option>
                    <option th:each="mun : ${municipios}"
                            th:value="${mun.nombre}"
                            th:attr="data-depto=${mun.departamento.id}"
                            th:text="${mun.nombre}"
                            hidden="hidden">
                    </option>
                </select>
            </div>

            <!-- ── Sección de atención médica ── -->
            <div class="col-span-1 md:col-span-2 mt-2">
                <p class="login-title" style="text-align:left; font-size:0.9rem; margin-bottom:0.5rem;">
                    Atención Médica
                </p>
            </div>

            <!-- Diagnóstico CIE-10 -->
            <div class="col-span-1 md:col-span-2">
                <label for="codigoCIE10" class="form-label-ips">Diagnóstico CIE-10</label>
                <select id="codigoCIE10" name="codigoCIE10" class="select-ips">
                    <option value="">-- Sin diagnóstico --</option>
                    <option th:each="dx : ${diagnosticoscie10}"
                            th:value="${dx.codigo}"
                            th:text="${dx.codigo + ' — ' + dx.diagnostico}">
                    </option>
                </select>
            </div>

            <!-- Motivo de consulta (AC-1 HU-024) -->
            <div class="col-span-1 md:col-span-2">
                <label for="motivoConsulta" class="form-label-ips">
                    Motivo de consulta
                    <span style="font-weight:400; color:#6b7280;">(mínimo 10 caracteres)</span>
                </label>
                <textarea id="motivoConsulta" name="motivoConsulta"
                          class="textarea-ips"
                          placeholder="Describa el motivo de la consulta del paciente..."
                          minlength="10" maxlength="2000"></textarea>
            </div>

            <!-- Botón -->
            <div class="col-span-1 md:col-span-2 mt-1">
                <button type="submit"
                        class="btn-acceder btn-acceder-full"
                        id="btnGuardar"
                        onclick="return confirmarGuardado()">
                    Finalizar Contacto y Registrar Paciente
                </button>
            </div>

        </form>

        <div class="text-center mt-3">
            <a href="/dashboard" class="link-olvido">← Volver al Dashboard</a>
        </div>

    </div>
</div>

<script>
    // Filtrar municipios por departamento seleccionado
    function filtrarMunicipios() {
        const deptoSel = document.getElementById('deptoSelect');
        const deptoId  = deptoSel.options[deptoSel.selectedIndex]?.getAttribute('data-id') || '';
        const muniSel  = document.getElementById('muniSelect');
        const opts     = muniSel.querySelectorAll('option[data-depto]');

        muniSel.value = '';
        opts.forEach(opt => {
            opt.hidden = opt.getAttribute('data-depto') !== deptoId;
        });
        muniSel.querySelector('option:not([data-depto])').textContent =
            deptoId ? '-- Seleccione municipio --' : '-- Seleccione departamento primero --';
    }

    // AC-8 HU-024: confirmación antes de enviar
    function confirmarGuardado() {
        const motivo = document.getElementById('motivoConsulta').value.trim();
        if (motivo.length > 0 && motivo.length < 10) {
            alert('El motivo de consulta debe tener al menos 10 caracteres.');
            return false;
        }
        const msg = motivo.length >= 10
            ? '¿Confirma el registro del paciente y su motivo de consulta?'
            : '¿Confirma el registro del paciente?';
        return confirm(msg);
    }

    // Deshabilitar botón tras envío
    document.getElementById('formPaciente').addEventListener('submit', function(e) {
        if (!confirmarGuardado()) { e.preventDefault(); return; }
        const btn = document.getElementById('btnGuardar');
        btn.disabled = true;
        btn.textContent = 'Registrando...';
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
