<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Paciente | IPS</title>

    <!-- AC-8: Tailwind CSS para diseño responsive -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon" type="image/x-icon" href="/img/icon/favicon.ico">
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center py-10 px-4">

<div class="bg-white w-full max-w-2xl rounded-2xl shadow-md p-8">

    <!-- Encabezado -->
    <div class="mb-6">
        <h1 class="text-2xl font-semibold text-slate-800">Registro de Paciente</h1>
        <p class="text-sm text-slate-500 mt-1">Complete los datos de identidad del paciente</p>
    </div>

    <!-- AC-9: Mensaje de éxito (el formulario aparece vacío por ser redirect) -->
    <div th:if="${exito}"
         class="mb-4 px-4 py-3 bg-green-50 border border-green-200 text-green-800
                rounded-lg text-sm">
        ✅ <span th:text="${exito}"></span>
    </div>

    <!-- Mensaje de error -->
    <div th:if="${error}"
         class="mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-800
                rounded-lg text-sm">
        ⚠ <span th:text="${error}"></span>
    </div>

    <!-- Formulario -->
    <form action="/pacientes/registro" method="post"
          class="grid grid-cols-1 md:grid-cols-2 gap-5">

        <!-- AC-1: Select tipo de documento desde catálogo -->
        <div class="md:col-span-2">
            <label for="tipoDocumento"
                   class="block text-sm font-medium text-slate-700 mb-1">
                Tipo de documento
            </label>
            <select id="tipoDocumento" name="tipoDocumento" required
                    class="w-full rounded-lg border border-slate-300 px-3 py-2
                           text-sm text-slate-700 focus:outline-none
                           focus:ring-2 focus:ring-blue-500">
                <option value="" disabled selected>-- Seleccione --</option>
                <option th:each="tipo : ${tiposDocumento}"
                        th:value="${tipo}"
                        th:text="${tipo}">
                </option>
            </select>
        </div>

        <!-- AC-2: Número de documento alfanumérico -->
        <div class="md:col-span-2">
            <label for="numeroDocumento"
                   class="block text-sm font-medium text-slate-700 mb-1">
                Número de documento
            </label>
            <input type="text" id="numeroDocumento" name="numeroDocumento"
                   placeholder="Ej: 1023456789"
                   required
                   class="w-full rounded-lg border border-slate-300 px-3 py-2
                          text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                   title="Ingrese el número de documento (no puede ser vacío ni negativo)">
        </div>

        <!-- AC-4: Nombres obligatorio -->
        <div>
            <label for="nombres"
                   class="block text-sm font-medium text-slate-700 mb-1">
                Nombres
            </label>
            <input type="text" id="nombres" name="nombres"
                   placeholder="Ej: Juan Carlos"
                   required
                   pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]{2,80}"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2
                          text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- AC-4: Apellidos obligatorio -->
        <div>
            <label for="apellidos"
                   class="block text-sm font-medium text-slate-700 mb-1">
                Apellidos
            </label>
            <input type="text" id="apellidos" name="apellidos"
                   placeholder="Ej: Pérez Gómez"
                   required
                   pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]{2,80}"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2
                          text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- AC-5: Fecha de nacimiento con input type="date" -->
        <div class="md:col-span-2">
            <label for="fechaNacimiento"
                   class="block text-sm font-medium text-slate-700 mb-1">
                Fecha de nacimiento
            </label>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento"
                   required
                   class="w-full rounded-lg border border-slate-300 px-3 py-2
                          text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Botón guardar -->
        <div class="md:col-span-2">
            <button type="submit" id="btnGuardar"
                    class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95
                           text-white font-medium py-2.5 rounded-lg text-sm
                           transition-all duration-150">
                Registrar paciente
            </button>
        </div>

    </form>

    
    <div class="mt-5 text-center">
        <a href="/dashboard" class="text-sm text-slate-500 hover:text-blue-600
                                    transition-colors">
            ← Volver al Dashboard
        </a>
    </div>
</div>

<!-- AC-9: Deshabilitar botón tras envío para evitar duplicados -->
<script>
    document.querySelector('form').addEventListener('submit', function () {
        const btn = document.getElementById('btnGuardar');
        btn.disabled = true;
        btn.textContent = 'Registrando...';
        btn.classList.add('opacity-60', 'cursor-not-allowed');
    });
</script>

</body>
</html>
