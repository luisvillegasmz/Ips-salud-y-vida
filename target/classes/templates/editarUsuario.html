<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario | IPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2>Editar Usuario</h2>

            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/usuarios/editar/{id}(id=${usuario.id})}"
                  method="post" class="row g-3" id="formEditar">

                <!-- AC-7: Labels vinculados correctamente -->
                <div class="col-md-6">
                    <label for="nombre" class="form-label">Nombre:</label>
                    <input type="text" class="form-control" id="nombre"
                           name="nombre"
                           th:value="${usuario.nombre}"
                           required>
                </div>

                <div class="col-md-6">
                    <label for="apellido" class="form-label">Apellido:</label>
                    <input type="text" class="form-control" id="apellido"
                           name="apellido"
                           th:value="${usuario.apellido}">
                </div>

                <div class="col-12">
                    <label for="direccion" class="form-label">Dirección:</label>
                    <input type="text" class="form-control" id="direccion"
                           name="direccion"
                           th:value="${usuario.direccion}"
                           required>
                </div>

                <div class="col-12">
                    <label for="celular" class="form-label">Celular:</label>
                    <input type="tel" class="form-control" id="celular"
                           name="celular"
                           th:value="${usuario.celular}"
                           pattern="[0-9]{10}">
                </div>

                <!-- AC-8: Botón se deshabilita tras el clic -->
                <div class="col-12">
                    <button type="submit" class="btn btn-primary btn-lg w-100"
                            id="btnGuardarEdicion">
                        Guardar cambios
                    </button>
                </div>
            </form>

            <a href="/usuarios" class="btn btn-secondary mt-3">Cancelar</a>
        </div>
    </div>
</div>

<!-- AC-8 -->
<script>
    document.getElementById('formEditar').addEventListener('submit', function () {
        const btn = document.getElementById('btnGuardarEdicion');
        btn.disabled = true;
        btn.textContent = 'Guardando...';
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
