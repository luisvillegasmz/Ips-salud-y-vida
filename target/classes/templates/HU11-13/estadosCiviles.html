<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Estados Civiles</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="contenedor">

    <!-- ENCABEZADO -->
    <div class="encabezado">

        <img src="https://cdn-icons-png.flaticon.com/512/3774/3774299.png"
             class="logo">

        <h3>Estados civiles</h3>

        <div class="icono-superior">
            <i class="bi bi-arrow-clockwise"></i>
        </div>

    </div>

    <!-- MENSAJES -->

    <div th:if="${exito}" class="alert alert-success">
        <span th:text="${exito}"></span>
    </div>

    <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
    </div>

    <!-- FORMULARIO -->

    <form th:action="@{/catalogos/estado-civil/guardar}"
          th:object="${estadoCivil}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="fila-formulario">

            <div>

                <label>Nombre*</label>

                <input type="text"
                       th:field="*{nombre}"
                       class="form-control"
                       placeholder="ej: Casado/a">

            </div>

        </div>

        <button type="submit" class="btn-guardar">
            Guardar estado civil
        </button>

    </form>

    <!-- TABLA -->

    <table class="table table-bordered tabla-documentos">

        <thead>

        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="estado : ${estados}">

            <td th:text="${estado.id}"></td>

            <td th:text="${estado.nombre}"></td>

            <td>

                <span th:if="${estado.activo}"
                      class="estado-activo">
                    Activo
                </span>

                <span th:unless="${estado.activo}"
                      class="estado-inactivo">
                    Inactivo
                </span>

            </td>

            <td class="acciones">

                <!-- EDITAR -->

                <a th:href="@{/catalogos/estado-civil/editar/{id}(id=${estado.id})}">
                    <i class="bi bi-pencil-square"></i>
                </a>

                <!-- CAMBIAR ESTADO -->

                <a th:href="@{/catalogos/estado-civil/estado/{id}(id=${estado.id})}">
                    <i class="bi bi-arrow-repeat"></i>
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
