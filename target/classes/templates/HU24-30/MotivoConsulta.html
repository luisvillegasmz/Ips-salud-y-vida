<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HU-024 Motivo de consulta | Salud y Vida IPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{/img/LogoSinLetras.png}" type="image/png">
</head>
<body>

<div class="login-wrapper" style="align-items: flex-start; padding-top: 2rem;">
    <div class="card-login card-xl">

        <!-- Encabezado -->
        <div class="hu-header">
            <div class="hu-header-logo">
                <img th:src="@{/img/LogoSinLetras.png}" src="/img/LogoSinLetras.png" alt="Logo IPS">
            </div>
            <h1 class="hu-header-title">Motivo de consulta</h1>
            <div class="hu-header-actions">
                <a href="/dashboard" class="icon-btn" title="Inicio">
                    <img th:src="@{/img/usuario.png}" src="/img/usuario.png" alt="Usuario">
                </a>
                <a href="/logout" class="icon-btn" title="Cerrar sesión">
                    <img th:src="@{/img/logo_salir.png}" src="/img/logo_salir.png" alt="Salir">
                </a>
            </div>
        </div>

        <!-- Datos del paciente -->
        <div class="dashboard-welcome" style="margin-bottom: 1.25rem;">
            <p class="dashboard-welcome-name">
                <span th:text="${paciente.nombres}"></span>
                <span th:text="${paciente.apellidos}"></span>
            </p>
            <p class="dashboard-welcome-sub">
                Doc: <span th:text="${paciente.tipoDocumento}"></span>
                &nbsp;·&nbsp;
                <span th:text="${paciente.numeroDocumento}"></span>
            </p>
        </div>

        <!-- Alertas -->
        <div th:if="${exito}" class="alert-exito" role="alert" th:text="${exito}"></div>
        <div th:if="${error}"  class="alert-error"  role="alert" th:text="${error}"></div>

        <!-- Formulario -->
        <form th:action="@{/consulta/motivo/{id}(id=${paciente.id})}" method="post" id="formMotivo">

            <!-- Descripción de síntomas (AC-1 HU-024) -->
            <div style="margin-bottom: 1rem;">
                <label for="descripcionSintomas" class="form-label-ips">
                    Descripción de los síntomas <span class="required">*</span>
                </label>
                <textarea id="descripcionSintomas"
                          name="descripcionSintomas"
                          class="textarea-ips"
                          rows="3"
                          placeholder="Describa los síntomas del paciente (mínimo 10 caracteres)..."
                          required
                          minlength="10"></textarea>
            </div>

            <!-- AC-6 HU-025: diagnóstico CIE-10 con modal Bootstrap -->
            <div style="margin-bottom: 1.25rem;">
                <label class="form-label-ips">Diagnóstico CIE-10</label>
                <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                    <input type="hidden" id="codigoCIE10" name="codigoCIE10">
                    <span id="cie10Seleccionado"
                          style="font-size:0.88rem; color:#1b3a5c; font-weight:600; min-width:60px;">
                        Sin diagnóstico
                    </span>
                    <button type="button" class="btn-acceder"
                            style="font-size:0.8rem; padding:6px 14px;"
                            data-bs-toggle="modal" data-bs-target="#modalCIE10">
                        Buscar diagnóstico
                    </button>
                    <button type="button" id="btnLimpiarCIE"
                            onclick="limpiarCIE10()"
                            style="font-size:0.78rem; padding:5px 10px; background:#6b7280;
                                   color:#fff; border:none; border-radius:8px; cursor:pointer; display:none;">
                        ✕ Quitar
                    </button>
                </div>
            </div>

            <!-- Síntomas con severidad -->
            <div class="sintomas-grid">
                <div class="sintoma-item">
                    <label for="fiebre">Fiebre</label>
                    <select id="fiebre" name="fiebre" class="sintoma-select">
                        <option value="">Selecciona</option>
                        <option th:each="s : ${severidades}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="sintoma-item">
                    <label for="tos">Tos</label>
                    <select id="tos" name="tos" class="sintoma-select">
                        <option value="">Selecciona</option>
                        <option th:each="s : ${severidades}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="sintoma-item">
                    <label for="dolorAbdominal">Dolor abdominal</label>
                    <select id="dolorAbdominal" name="dolorAbdominal" class="sintoma-select">
                        <option value="">Selecciona</option>
                        <option th:each="s : ${severidades}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="sintoma-item">
                    <label for="nauseas">Náuseas</label>
                    <select id="nauseas" name="nauseas" class="sintoma-select">
                        <option value="">Selecciona</option>
                        <option th:each="s : ${severidades}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="sintoma-item">
                    <label for="mareo">Mareo</label>
                    <select id="mareo" name="mareo" class="sintoma-select">
                        <option value="">Selecciona</option>
                        <option th:each="s : ${severidades}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="sintoma-item">
                    <label for="fatiga">Fatiga</label>
                    <select id="fatiga" name="fatiga" class="sintoma-select">
                        <option value="">Selecciona</option>
                        <option th:each="s : ${severidades}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
            </div>

            <!-- Botones (AC-8 HU-024) -->
            <div style="display:flex; gap:10px; margin-top:1.5rem; justify-content:flex-end;">
                <a th:href="@{/pacientes/buscar}" class="btn-volver" style="margin-top:0; align-self:center;">
                    ← Volver
                </a>
                <button type="submit" class="btn-acceder" id="btnGuardar">
                    Registrar consulta
                </button>
            </div>
        </form>

        <!-- AC-5 HU-025: historial con código CIE-10 visible -->
        <div th:if="${historial != null and !#lists.isEmpty(historial)}"
             style="margin-top:2rem; border-top:1px solid #e5e7eb; padding-top:1.25rem;">
            <p class="form-label-ips" style="margin-bottom:.75rem; font-size:0.85rem;">
                Consultas anteriores
            </p>
            <div th:each="m : ${historial}" class="historial-card">
                <strong th:text="${#temporals.format(m.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></strong>
                <span th:if="${m.codigoCIE10 != null and !#strings.isEmpty(m.codigoCIE10)}"
                      class="historial-cie"
                      th:text="${m.codigoCIE10}"></span>
                &nbsp;—&nbsp;
                <span th:text="${m.descripcionSintomas}"></span>
            </div>
        </div>

    </div>
</div>

<!-- AC-6 HU-025: Modal Bootstrap para buscar y seleccionar diagnóstico CIE-10 -->
<div class="modal fade" id="modalCIE10" tabindex="-1" aria-labelledby="modalCIE10Label" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalCIE10Label">Buscar diagnóstico CIE-10</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <input type="text" id="buscadorCIE10" class="form-control mb-3"
                       placeholder="Buscar por código o nombre (ej: J00, Influenza)..."
                       oninput="filtrarCIE10(this.value)" autocomplete="off">
                <div id="listaCIE10">
                    <!-- Opciones generadas desde Thymeleaf -->
                    <div th:each="dx : ${diagnosticoscie10}"
                         class="cie10-modal-item"
                         th:attr="data-codigo=${dx.codigo}, data-nombre=${dx.diagnostico}"
                         th:onclick="'seleccionarCIE10(\'' + ${dx.codigo} + '\', \'' + ${dx.diagnostico} + '\')'">
                        <span class="cie10-code" th:text="${dx.codigo}"></span>
                        <span th:text="${dx.diagnostico}"></span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('formMotivo').addEventListener('submit', function () {
        const btn = document.getElementById('btnGuardar');
        btn.disabled = true;
        btn.textContent = 'Guardando...';
    });

    function seleccionarCIE10(codigo, nombre) {
        document.getElementById('codigoCIE10').value = codigo;
        document.getElementById('cie10Seleccionado').textContent = codigo + ' — ' + nombre;
        document.getElementById('btnLimpiarCIE').style.display = 'inline-block';
        bootstrap.Modal.getInstance(document.getElementById('modalCIE10')).hide();
    }

    function limpiarCIE10() {
        document.getElementById('codigoCIE10').value = '';
        document.getElementById('cie10Seleccionado').textContent = 'Sin diagnóstico';
        document.getElementById('btnLimpiarCIE').style.display = 'none';
    }

    function filtrarCIE10(q) {
        const termino = q.toLowerCase();
        document.querySelectorAll('#listaCIE10 .cie10-modal-item').forEach(function (item) {
            const codigo = item.getAttribute('data-codigo').toLowerCase();
            const nombre = item.getAttribute('data-nombre').toLowerCase();
            item.style.display = (codigo.includes(termino) || nombre.includes(termino)) ? '' : 'none';
        });
    }

    document.getElementById('modalCIE10').addEventListener('shown.bs.modal', function () {
        document.getElementById('buscadorCIE10').focus();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
