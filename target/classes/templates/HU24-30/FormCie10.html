<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${modoEdicion} ? 'Editar Diagnóstico | Salud y Vida IPS' : 'Nuevo Diagnóstico | Salud y Vida IPS'">
        Diagnóstico | Salud y Vida IPS
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{/img/LogoSinLetras.png}" type="image/png">
    <style>
        .hu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.75rem;
        }
        .hu-header-logo img { height: 56px; width: auto; }
        .hu-header-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1b3a5c;
            margin: 0;
            text-align: center;
            flex: 1;
        }
        .hu-header-actions { display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #1b3a5c;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            overflow: hidden;
            text-decoration: none;
        }
        .icon-btn:hover { background: #142d47; transform: scale(1.07); }
        .icon-btn img { width: 24px; height: 24px; object-fit: contain; filter: brightness(10); }
    </style>
</head>
<body>

<div class="login-wrapper" style="align-items: flex-start; padding-top: 2rem;">
    <div class="card-login card-wide">

        <!-- ── Encabezado ─────────────────────────────────────────── -->
        <div class="hu-header">
            <div class="hu-header-logo">
                <img th:src="@{/img/LogoSinLetras.png}" src="/img/LogoSinLetras.png" alt="Logo IPS">
            </div>
            <h1 class="hu-header-title"
                th:text="${modoEdicion} ? 'Editar diagnóstico' : 'Añadir diagnóstico'">
                Diagnóstico CIE-10
            </h1>
            <div class="hu-header-actions">
                <a href="/dashboard" class="icon-btn" title="Perfil de usuario">
                    <img th:src="@{/img/usuario.png}" src="/img/usuario.png" alt="Usuario">
                </a>
                <a href="/logout" class="icon-btn" title="Cerrar sesión">
                    <img th:src="@{/img/logo_salir.png}" src="/img/logo_salir.png" alt="Salir">
                </a>
            </div>
        </div>

        <!-- Alerta de error -->
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <!-- ── Formulario ─────────────────────────────────────────── -->
        <form th:action="${modoEdicion} ? @{/cie10/editar/{id}(id=${diagnostico.id})} : @{/cie10/nuevo}"
              method="post"
              id="formCIE">

            <div style="margin-bottom: 1rem;">
                <label for="codigo" class="form-label-ips">
                    Código CIE-10 <span class="required">*</span>
                </label>
                <input type="text"
                       id="codigo"
                       name="codigo"
                       class="input-login"
                       th:value="${diagnostico.codigo}"
                       placeholder="Ej: J00, E11, I10"
                       required
                       maxlength="10"
                       style="text-transform: uppercase;">
            </div>

            <div style="margin-bottom: 1rem;">
                <label for="diagnosticoNombre" class="form-label-ips">
                    Diagnóstico <span class="required">*</span>
                </label>
                <input type="text"
                       id="diagnosticoNombre"
                       name="diagnostico"
                       class="input-login"
                       th:value="${diagnostico.diagnostico}"
                       placeholder="Nombre del diagnóstico"
                       required
                       maxlength="200">
            </div>

            <div style="margin-bottom: 1.25rem;">
                <label for="categoria" class="form-label-ips">
                    Categoría <span class="required">*</span>
                </label>
                <select id="categoria" name="categoria" class="select-ips" required>
                    <option value="">-- Seleccione una categoría --</option>
                    <option th:each="cat : ${categorias}"
                            th:value="${cat}"
                            th:text="${cat}"
                            th:selected="${cat == diagnostico.categoria}">
                    </option>
                </select>
            </div>

            <button type="submit"
                    class="btn-acceder btn-acceder-full"
                    id="btnGuardar"
                    th:text="${modoEdicion} ? 'Guardar cambios' : 'Añadir diagnóstico'">
                Guardar
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="/cie10" class="link-olvido">← Cancelar y volver</a>
        </div>

    </div>
</div>

<script>
    // Forzar mayúsculas en el campo código
    document.getElementById('codigo').addEventListener('input', function () {
        this.value = this.value.toUpperCase();
    });

    document.getElementById('formCIE').addEventListener('submit', function () {
        const btn = document.getElementById('btnGuardar');
        btn.disabled = true;
        btn.textContent = 'Guardando...';
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
