<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Discapacidades</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .form-container { max-width: 500px; }
    </style>
</head>
<body class="container mt-4">

    <h2 class="mb-3">Gestión de Discapacidades</h2>

    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>

    <!-- Formulario -->
    <div class="form-container mb-4 p-3 border rounded bg-light">
        <form th:action="@{/discapacidades/guardar}" method="post">
            <h5 th:text="${editar != null} ? 'Editar Discapacidad' : 'Nueva Discapacidad'">Formulario</h5>

            <input type="hidden" name="id" th:value="${editar != null} ? ${editar.id} : ''">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" name="nombre" class="form-control"
                       th:value="${editar != null} ? ${editar.nombre} : ''"
                       placeholder="Ej: Visual, Auditiva, Motriz" required>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <span th:text="${editar != null} ? 'Actualizar' : 'Guardar'">Guardar</span>
                </button>
                <a th:if="${editar != null}" href="/discapacidades" class="btn btn-secondary">
                    Cancelar
                </a>
            </div>
        </form>
    </div>

    <!-- Tabla -->
    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="dis : ${discapacidades}">
                <td th:text="${dis.id}"></td>
                <td th:text="${dis.nombre}"></td>
                <td>
                    <span th:if="${dis.activo}" class="badge bg-success">Activo</span>
                    <span th:unless="${dis.activo}" class="badge bg-secondary">Inactivo</span>
                </td>
                <td>
                    <a th:href="@{/discapacidades/editar/{id}(id=${dis.id})}"
                       class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/discapacidades/inactivar/{id}(id=${dis.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Inactivar esta discapacidad?')">
                       Inactivar
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
