<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Municipios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2 class="mb-3">Gestión de Municipios</h2>

    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>

    <!-- Formulario -->
    <form th:action="@{/municipios/guardar}" method="post" class="mb-4 p-3 border rounded bg-light">
        <h5 th:text="${editar != null} ? 'Editar Municipio' : 'Nuevo Municipio'">Formulario</h5>

        <input type="hidden" name="id" th:value="${editar != null} ? ${editar.id} : ''">

        <div class="row g-2">
            <div class="col-md-3">
                <label class="form-label">Departamento</label>
                <select name="departamentoId" class="form-select" required>
                    <option value="">-- Selecciona --</option>
                    <option th:each="dep : ${departamentos}"
                            th:value="${dep.id}"
                            th:text="${dep.nombre}"
                            th:selected="${editar != null and editar.departamento.id == dep.id}">
                    </option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Código DANE</label>
                <input type="text" name="codigoDane" class="form-control"
                       th:value="${editar != null} ? ${editar.codigoDane} : ''"
                       placeholder="Ej: 05001" maxlength="5" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Nombre del Municipio</label>
                <input type="text" name="nombre" class="form-control"
                       th:value="${editar != null} ? ${editar.nombre} : ''"
                       placeholder="Ej: Medellín" required>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">
                    <span th:text="${editar != null} ? 'Actualizar' : 'Guardar'">Guardar</span>
                </button>
            </div>
            <div class="col-md-1 d-flex align-items-end" th:if="${editar != null}">
                <a href="/municipios" class="btn btn-secondary w-100">Cancelar</a>
            </div>
        </div>
    </form>

    <!-- Tabla -->
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Código DANE</th>
                <th>Municipio</th>
                <th>Departamento</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="mun : ${municipios}">
                <td th:text="${mun.id}"></td>
                <td th:text="${mun.codigoDane}"></td>
                <td th:text="${mun.nombre}"></td>
                <td th:text="${mun.departamento.nombre}"></td>
                <td>
                    <a th:href="@{/municipios/editar/{id}(id=${mun.id})}"
                       class="btn btn-warning btn-sm">Editar</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
