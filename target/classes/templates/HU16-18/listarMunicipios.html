<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Municipios | Salud y Vida IPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{/img/LogoSinLetras.png}" type="image/png">
</head>
<body>

<div class="login-wrapper" style="align-items: flex-start; padding-top: 2rem;">
    <div class="card-login card-full">

        <div class="page-header">
            <div class="page-header-left">
                <img th:src="@{/img/Logo.png}" src="/img/Logo.png" alt="Logo Salud y Vida IPS">
                <div>
                    <p class="page-title">Municipios</p>
                    <p class="page-meta">Catálogo de municipios del sistema</p>
                </div>
            </div>
            <a href="/dashboard" class="btn-volver">← Volver al inicio</a>
        </div>

        <div th:if="${exito}" class="alert-exito" th:text="${exito}"></div>

        <!-- Formulario -->
        <form th:action="@{/municipios/guardar}" method="post"
              class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">

            <input type="hidden" name="id" th:value="${editar != null} ? ${editar.id} : ''">

            <div>
                <label class="form-label-ips">Departamento <span class="required">*</span></label>
                <select name="departamentoId" class="select-ips" required>
                    <option value="">-- Seleccione --</option>
                    <option th:each="dep : ${departamentos}"
                            th:value="${dep.id}"
                            th:text="${dep.nombre}"
                            th:selected="${editar != null and editar.departamento.id == dep.id}">
                    </option>
                </select>
            </div>

            <div>
                <label class="form-label-ips">Código DANE <span class="required">*</span></label>
                <input type="text" name="codigoDane" class="input-login"
                       th:value="${editar != null} ? ${editar.codigoDane} : ''"
                       placeholder="Ej: 05001" maxlength="5" required>
            </div>

            <div>
                <label class="form-label-ips">Nombre del municipio <span class="required">*</span></label>
                <input type="text" name="nombre" class="input-login"
                       th:value="${editar != null} ? ${editar.nombre} : ''"
                       placeholder="Ej: Medellín" required maxlength="100">
            </div>

            <div class="flex items-end gap-2">
                <button type="submit" class="btn-acceder btn-acceder-full"
                        th:text="${editar != null} ? 'Actualizar' : 'Guardar'">
                    Guardar
                </button>
                <a th:if="${editar != null}" href="/municipios"
                   class="btn-acceder btn-acceder-full"
                   style="background-color:#6b7280; text-align:center;">
                    Cancelar
                </a>
            </div>
        </form>

        <!-- Tabla -->
        <div style="overflow-x: auto;">
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Código DANE</th>
                        <th>Municipio</th>
                        <th>Departamento</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="mun : ${municipios}">
                        <td th:text="${mun.id}"></td>
                        <td><strong th:text="${mun.codigoDane}"></strong></td>
                        <td th:text="${mun.nombre}"></td>
                        <td th:text="${mun.departamento.nombre}"></td>
                        <td class="td-acciones">
                            <a th:href="@{/municipios/editar/{id}(id=${mun.id})}"
                               class="btn-editar">Editar</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(municipios)}">
                        <td colspan="5" class="sin-registros">No hay municipios registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
