<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Géneros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="contenedor">

    <div class="encabezado">

        <img src="https://cdn-icons-png.flaticon.com/512/3774/3774299.png"
             class="logo">

        <h3>Géneros</h3>

        <div class="icono-superior">
            <i class="bi bi-person-lines-fill"></i>
        </div>

    </div>

    <div th:if="${exito}" class="alert alert-success">
        <span th:text="${exito}"></span>
    </div>

    <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/catalogos/genero/guardar}"
          th:object="${genero}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="fila-formulario">

            <div>

                <label>Nombre del género*</label>

                <input type="text"
                       th:field="*{nombre}"
                       class="form-control"
                       placeholder="Ej: Masculino">

            </div>

        </div>

        <button type="submit" class="btn-guardar">
            Guardar género
        </button>

    </form>

    <table class="table table-bordered tabla-documentos">

        <thead>

        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="genero : ${generos}">

            <td th:text="${genero.id}"></td>

            <td th:text="${genero.nombre}"></td>

            <td>

                <span th:if="${genero.activo}"
                      class="estado-activo">
                    Activo
                </span>

                <span th:unless="${genero.activo}"
                      class="estado-inactivo">
                    Inactivo
                </span>

            </td>

            <td class="acciones">

                <a th:href="@{/catalogos/genero/editar/{id}(id=${genero.id})}">
                    <i class="bi bi-pencil-square"></i>
                </a>

                <a th:href="@{/catalogos/genero/estado/{id}(id=${genero.id})}">
                    <i class="bi bi-arrow-repeat"></i>
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
