<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Tipos de Documento</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="contenedor">

        <div class="encabezado">

            <img src="https://cdn-icons-png.flaticon.com/512/3774/3774299.png"
                class="logo">

            <h3>Tipo de documento</h3>

            <div class="icono-superior">
                <i class="bi bi-arrow-clockwise"></i>
            </div>

        </div>

        <form th:action="@{/catalogos/tipo-documento/guardar}"
            th:object="${tipoDocumento}"
            method="post">

            <input type="hidden" th:field="*{id}">

            <div class="fila-formulario">

                <div>

                    <label>Código*</label>

                    <input type="text"
                        th:field="*{codigo}"
                        class="form-control"
                        placeholder="ej: CC">

                </div>

                <div>

                    <label>Nombre*</label>

                    <input type="text"
                        th:field="*{nombre}"
                        class="form-control"
                        placeholder="ej: Cedula de Ciudadanía">

                </div>

            </div>

            <button type="submit" class="btn-guardar">
                Guardar tipo de documento
            </button>

        </form>

        <table class="table table-bordered tabla-documentos">

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>

            </thead>

            <tbody>

                <tr th:each="tipo : ${tipos}">

                    <td th:text="${tipo.id}"></td>

                    <td th:text="${tipo.codigo}"></td>

                    <td th:text="${tipo.nombre}"></td>

                    <td>

                        <span th:if="${tipo.activo}"
                            class="estado-activo">
                            Activo
                        </span>

                        <span th:unless="${tipo.activo}"
                            class="estado-inactivo">
                            Inactivo
                        </span>

                    </td>

                    <td class="acciones">

                        <a th:href="@{/catalogos/tipo-documento/editar/{id}(id=${tipo.id})}">
                            <i class="bi bi-pencil-square"></i>
                        </a>

                        <a th:href="@{/catalogos/tipo-documento/estado/{id}(id=${tipo.id})}">
                            <i class="bi bi-arrow-repeat"></i>
                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</body>

</html>
