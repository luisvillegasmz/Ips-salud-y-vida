<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de Documento | Salud y Vida IPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{/img/LogoSinLetras.png}" type="image/png">
</head>
<body>

<div class="login-wrapper" style="align-items: flex-start; padding-top: 2rem;">
    <div class="card-login card-full">

        <div class="page-header">
            <div class="page-header-left">
                <img th:src="@{/img/Logo.png}" src="/img/Logo.png" alt="Logo Salud y Vida IPS">
                <div>
                    <p class="page-title">Tipos de Documento</p>
                    <p class="page-meta">Catálogo de tipos de identificación</p>
                </div>
            </div>
            <a href="/dashboard" class="btn-volver">← Volver al inicio</a>
        </div>

        <div th:if="${exito}" class="alert alert-success py-2 px-3 mb-3" th:text="${exito}"></div>
        <div th:if="${error}" class="alert alert-danger py-2 px-3 mb-3" th:text="${error}"></div>

        <!-- Formulario -->
        <form th:action="@{/catalogos/tipo-documento/guardar}"
              th:object="${tipoDocumento}" method="post"
              class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">

            <input type="hidden" th:field="*{id}">

            <div>
                <label class="form-label-ips">Código <span class="required">*</span></label>
                <input type="text" th:field="*{codigo}" class="input-login"
                       placeholder="Ej: CC" required maxlength="10"
                       style="text-transform: uppercase;">
            </div>

            <div class="col-span-2">
                <label class="form-label-ips">Nombre <span class="required">*</span></label>
                <input type="text" th:field="*{nombre}" class="input-login"
                       placeholder="Ej: Cédula de Ciudadanía" required maxlength="100">
            </div>

            <div class="flex items-end">
                <button type="submit" class="btn-acceder btn-acceder-full">
                    Guardar
                </button>
            </div>
        </form>

        <!-- Tabla — ✅ AC-8 HU-011: activos en verde, inactivos en gris (Tailwind) -->
        <div style="overflow-x: auto;">
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tipo : ${tipos}"
                        th:class="${tipo.activo} ? '' : 'table-secondary'">
                        <td th:text="${tipo.id}"></td>
                        <td><strong th:text="${tipo.codigo}"></strong></td>
                        <td th:text="${tipo.nombre}"></td>
                        <td>
                            <span th:if="${tipo.activo}" class="badge-activo">Activo</span>
                            <span th:unless="${tipo.activo}" class="badge-inactivo">Inactivo</span>
                        </td>
                        <td style="display:flex; gap:6px; align-items:center;">
                            <a th:href="@{/catalogos/tipo-documento/editar/{id}(id=${tipo.id})}"
                               class="btn-editar">Editar</a>
                            <a th:href="@{/catalogos/tipo-documento/estado/{id}(id=${tipo.id})}"
                               class="btn-inactivar"
                               onclick="return confirm('¿Cambiar estado?')">
                                Cambiar estado
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tipos)}">
                        <td colspan="5" class="sin-registros">No hay tipos de documento registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
