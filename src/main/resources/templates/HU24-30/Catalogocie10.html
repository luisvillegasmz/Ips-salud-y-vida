<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HU-026 Catálogo CIE-10 | Salud y Vida IPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{/img/LogoSinLetras.png}" type="image/png">
    <style>
        /* ── Encabezado tipo mockup ─────────────────────────── */
        .hu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.75rem;
        }
        .hu-header-logo img { height: 56px; width: auto; }
        .hu-header-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1b3a5c;
            margin: 0;
            text-align: center;
            flex: 1;
        }
        .hu-header-actions { display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #1b3a5c;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            overflow: hidden;
            text-decoration: none;
        }
        .icon-btn:hover { background: #142d47; transform: scale(1.07); }
        .icon-btn img { width: 24px; height: 24px; object-fit: contain; filter: brightness(10); }

        /* ── Barra de acciones ──────────────────────────────── */
        .action-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }
        .btn-action-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #1b3a5c;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 8px;
            border: 1.5px solid #1b3a5c;
            transition: background 0.2s, color 0.2s;
        }
        .btn-action-link:hover { background: #1b3a5c; color: #fff; }
        .btn-action-link svg { flex-shrink: 0; }

        /* Buscador inline */
        .search-inline {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }
        .search-inline input {
            background: #f1f4f8;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.88rem;
            color: #374151;
            width: 220px;
            outline: none;
            transition: box-shadow 0.2s;
        }
        .search-inline input:focus { box-shadow: 0 0 0 2px rgba(27,58,92,0.2); }

        /* ── Iconos de acción en tabla ──────────────────────── */
        .btn-icono {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: background 0.15s;
            display: inline-flex;
            align-items: center;
        }
        .btn-icono-editar { color: #92400e; }
        .btn-icono-editar:hover { background: #fef3c7; }
        .btn-icono-eliminar { color: #991b1b; }
        .btn-icono-eliminar:hover { background: #fee2e2; }
        .btn-icono svg { width: 16px; height: 16px; }
    </style>
</head>
<body>

<div class="login-wrapper" style="align-items: flex-start; padding-top: 2rem;">
    <div class="card-login card-xl">

        <!-- ── Encabezado ─────────────────────────────────────────── -->
        <div class="hu-header">
            <div class="hu-header-logo">
                <img th:src="@{/img/LogoSinLetras.png}" src="/img/LogoSinLetras.png" alt="Logo IPS">
            </div>
            <h1 class="hu-header-title">Catálogo CIE-10</h1>
            <div class="hu-header-actions">
                <a href="/dashboard" class="icon-btn" title="Perfil de usuario">
                    <img th:src="@{/img/usuario.png}" src="/img/usuario.png" alt="Usuario">
                </a>
                <a href="/logout" class="icon-btn" title="Cerrar sesión">
                    <img th:src="@{/img/logo_salir.png}" src="/img/logo_salir.png" alt="Salir">
                </a>
            </div>
        </div>

        <!-- ── Alertas ────────────────────────────────────────────── -->
        <div th:if="${exito}" class="alert-exito" role="alert" th:text="${exito}"></div>

        <!-- ── Barra de acciones ──────────────────────────────────── -->
        <div class="action-bar">
            <a href="/cie10/nuevo" class="btn-action-link">
                <!-- + icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15"
                     fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Añadir diagnóstico
            </a>

            <!-- Búsqueda -->
            <form th:action="@{/cie10}" method="get" class="search-inline">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                     fill="none" viewBox="0 0 24 24" stroke="#6b7280" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" name="q" th:value="${q}" placeholder="Buscar diagnóstico…">
                <button type="submit" class="btn-acceder" style="padding:8px 14px; font-size:0.82rem;">
                    Buscar
                </button>
            </form>
        </div>

        <!-- ── Tabla ──────────────────────────────────────────────── -->
        <div style="overflow-x: auto;">
            <table class="tabla-ips">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Diagnóstico</th>
                        <th>Categoría</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Sin resultados -->
                    <tr th:if="${#lists.isEmpty(diagnosticos)}">
                        <td colspan="5" class="sin-registros">No se encontraron diagnósticos.</td>
                    </tr>
                    <!-- Filas -->
                    <tr th:each="d : ${diagnosticos}">
                        <td><strong th:text="${d.codigo}"></strong></td>
                        <td th:text="${d.diagnostico}"></td>
                        <td th:text="${d.categoria}"></td>
                        <td>
                            <span th:if="${d.activo}"  class="badge-activo">Activo</span>
                            <span th:unless="${d.activo}" class="badge-inactivo">Inactivo</span>
                        </td>
                        <td>
                            <div class="td-acciones">
                                <!-- Editar -->
                                <a th:href="@{/cie10/editar/{id}(id=${d.id})}"
                                   class="btn-icono btn-icono-editar" title="Editar">
                                    <!-- pencil icon -->
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                              d="M15.232 5.232l3.536 3.536M9 13l6.586-6.586a2 2 0 112.828 2.828L11.828 15.828A2 2 0 0110 16.414H8v-2a2 2 0 01.586-1.414z"/>
                                    </svg>
                                </a>
                                <!-- Eliminar -->
                                <form th:action="@{/cie10/eliminar/{id}(id=${d.id})}"
                                      method="post"
                                      onsubmit="return confirm('¿Eliminar este diagnóstico?');">
                                    <button type="submit" class="btn-icono btn-icono-eliminar" title="Eliminar">
                                        <!-- trash icon -->
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                            <polyline points="3 6 5 6 21 6"/>
                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                  d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                  d="M10 11v6M14 11v6"/>
                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                  d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
                                        </svg>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Volver -->
        <div style="margin-top: 1.5rem; text-align: left;">
            <a href="/dashboard" class="btn-volver">← Volver al inicio</a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
