<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HU-027 Búsqueda de pacientes | Salud y Vida IPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{/img/LogoSinLetras.png}" type="image/png">
    <style>
        /* ── Encabezado tipo mockup ─────────────────────────── */
        .hu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.75rem;
        }
        .hu-header-logo img { height: 56px; width: auto; }
        .hu-header-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1b3a5c;
            margin: 0;
            text-align: center;
            flex: 1;
        }
        .hu-header-actions { display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #1b3a5c;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            overflow: hidden;
            text-decoration: none;
        }
        .icon-btn:hover { background: #142d47; transform: scale(1.07); }
        .icon-btn img { width: 24px; height: 24px; object-fit: contain; filter: brightness(10); }

        /* ── Panel de búsqueda ──────────────────────────────── */
        .search-panel {
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .search-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
            display: block;
        }
        .search-input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f1f4f8;
            border-radius: 8px;
            padding: 0 14px;
            border: 1.5px solid transparent;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input-wrapper:focus-within {
            border-color: #1b3a5c;
            box-shadow: 0 0 0 2px rgba(27,58,92,0.12);
        }
        .search-input-wrapper svg { flex-shrink: 0; color: #9aa5b0; }
        .search-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 11px 0;
            font-size: 0.9rem;
            color: #374151;
        }
        .search-input-wrapper input::placeholder { color: #9aa5b0; }

        /* Filtros rápidos */
        .filter-chips {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .chip {
            font-size: 0.8rem;
            font-weight: 500;
            padding: 5px 14px;
            border-radius: 20px;
            border: 1.5px solid #cbd5e1;
            background: #f8fafc;
            color: #374151;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        .chip:hover, .chip.active {
            background: #1b3a5c;
            border-color: #1b3a5c;
            color: #ffffff;
        }

        /* ── Tarjeta de resultado ───────────────────────────── */
        .result-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 10px;
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .result-card:hover {
            box-shadow: 0 4px 14px rgba(27,58,92,0.1);
            border-color: #1b3a5c;
        }
        .result-info strong {
            font-size: 0.95rem;
            color: #1b3a5c;
            display: block;
        }
        .result-info span {
            font-size: 0.78rem;
            color: #6b7280;
        }
        .result-actions { display: flex; gap: 8px; }

        /* Indicador vacío */
        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: #9ca3af;
            font-size: 0.9rem;
        }
        .empty-state svg { margin: 0 auto 12px; display: block; opacity: 0.4; }
    </style>
</head>
<body>

<div class="login-wrapper" style="align-items: flex-start; padding-top: 2rem;">
    <div class="card-login card-xl">

        <!-- ── Encabezado ─────────────────────────────────────────── -->
        <div class="hu-header">
            <div class="hu-header-logo">
                <img th:src="@{/img/LogoSinLetras.png}" src="/img/LogoSinLetras.png" alt="Logo IPS">
            </div>
            <h1 class="hu-header-title">Búsqueda de pacientes</h1>
            <div class="hu-header-actions">
                <a href="/dashboard" class="icon-btn" title="Perfil de usuario">
                    <img th:src="@{/img/usuario.png}" src="/img/usuario.png" alt="Usuario">
                </a>
                <a href="/logout" class="icon-btn" title="Cerrar sesión">
                    <img th:src="@{/img/logo_salir.png}" src="/img/logo_salir.png" alt="Salir">
                </a>
            </div>
        </div>

        <!-- ── Panel de búsqueda ──────────────────────────────────── -->
        <div class="search-panel">
            <form th:action="@{/pacientes/buscar}" method="get">
                <label class="search-label">Criterio de búsqueda</label>
                <div class="search-input-wrapper">
                    <!-- Lupa -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                         fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text"
                           name="q"
                           th:value="${q}"
                           placeholder="Ingrese Nombre o ID..."
                           autocomplete="off"
                           id="searchInput">
                    <button type="submit" class="btn-acceder"
                            style="padding: 7px 16px; font-size: 0.82rem; margin: 4px 0;">
                        Buscar
                    </button>
                </div>

                <!-- Filtros rápidos -->
                <div class="filter-chips">
                    <a th:href="@{/pacientes/buscar(filtro='recientes')}"
                       th:classappend="${filtro == 'recientes'} ? 'active' : ''"
                       class="chip">Recientes</a>
                    <a th:href="@{/pacientes/buscar(filtro='prioritarios')}"
                       th:classappend="${filtro == 'prioritarios'} ? 'active' : ''"
                       class="chip">Prioritarios</a>
                </div>
            </form>
        </div>

        <!-- ── Resultados ─────────────────────────────────────────── -->

        <!-- Estado vacío: sin búsqueda realizada -->
        <div th:if="${resultados == null or (resultados.isEmpty() and q == null and filtro == null)}"
             class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            Ingresa un nombre o ID para buscar pacientes,<br>
            o usa los filtros rápidos.
        </div>

        <!-- Sin resultados (búsqueda ejecutada pero sin coincidencias) -->
        <div th:if="${resultados != null and resultados.isEmpty() and (q != null or filtro != null)}"
             class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            No se encontraron pacientes que coincidan con la búsqueda.
        </div>

        <!-- Lista de resultados -->
        <div th:if="${resultados != null and !resultados.isEmpty()}">
            <p style="font-size:0.8rem; color:#6b7280; margin-bottom: 10px;">
                <strong th:text="${resultados.size()}"></strong>
                resultado(s) encontrado(s)
            </p>
            <div th:each="p : ${resultados}" class="result-card">
                <div class="result-info">
                    <strong>
                        <span th:text="${p.nombres}"></span>
                        <span th:text="${p.apellidos}"></span>
                    </strong>
                    <span>
                        <span th:text="${p.tipoDocumento}"></span>
                        &nbsp;·&nbsp;
                        <span th:text="${p.numeroDocumento}"></span>
                        &nbsp;·&nbsp;Nac.
                        <span th:text="${#temporals.format(p.fechaNacimiento, 'dd/MM/yyyy')}"></span>
                    </span>
                </div>
                <div class="result-actions">
                    <!-- Ver / registrar motivo de consulta -->
                    <a th:href="@{/consulta/motivo/{id}(id=${p.id})}"
                       class="btn-acceder"
                       style="font-size: 0.8rem; padding: 7px 14px;">
                        Consulta
                    </a>
                </div>
            </div>
        </div>

        <!-- Volver -->
        <div style="margin-top: 1.5rem;">
            <a href="/dashboard" class="btn-volver">← Volver al inicio</a>
        </div>

    </div>
</div>

<script>
    // Auto-focus al campo de búsqueda
    document.getElementById('searchInput').focus();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
