<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Usuarios | IPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Gestión de Usuarios</h2>

    <a href="/registro" class="btn btn-success mb-3">+ Nuevo usuario</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Username</th>
                <th>Email</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.nombre}"></td>
                <td th:text="${u.apellido}"></td>
                <td th:text="${u.username}"></td>
                <td th:text="${u.email}"></td>
                <td>
                    <span th:if="${u.activo}" class="badge bg-success">Activo</span>
                    <span th:unless="${u.activo}" class="badge bg-secondary">Inactivo</span>
                </td>
                <td>
                    <a th:href="@{/usuarios/editar/{id}(id=${u.id})}"
                       class="btn btn-sm btn-warning">Editar</a>

                    <form th:action="@{/usuarios/inactivar/{id}(id=${u.id})}"
                          method="post" style="display:inline"
                          th:if="${u.activo}">
                        <button type="submit" class="btn btn-sm btn-danger"
                                onclick="return confirm('¿Inactivar este usuario?')">
                            Inactivar
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <a href="/dashboard" class="btn btn-secondary mt-2">Volver al Dashboard</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
