<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro | IPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" type="image/x-icon" href="/img/icon/favicon.ico">
</head>
<body>
<div class="container text-center mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="mt-4">Registro de usuario</h1>

            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>

            <form action="/registro" method="post" class="row g-3" id="formRegistro">

                <!-- AC-1 + AC-7: Nombre -->
                <div class="col-md-6">
                    <label for="nombre" class="form-label">Nombre:</label>
                    <input type="text" class="form-control" id="nombre"
                           name="nombre"
                           placeholder="Ingrese su nombre"
                           required
                           pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]{2,50}"
                           title="Solo letras, entre 2 y 50 caracteres">
                </div>

                <!-- AC-7: Apellido -->
                <div class="col-md-6">
                    <label for="apellido" class="form-label">Apellido:</label>
                    <input type="text" class="form-control" id="apellido"
                           name="apellido"
                           placeholder="Ingrese su apellido"
                           pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]{2,50}"
                           title="Solo letras, entre 2 y 50 caracteres">
                </div>

                <!-- AC-1 + AC-5: Username único -->
                <div class="col-12">
                    <label for="username" class="form-label">Nombre de usuario:</label>
                    <input type="text" class="form-control" id="username"
                           name="username"
                           placeholder="Ej: jperez"
                           required
                           minlength="4"
                           title="El nombre de usuario debe tener al menos 4 caracteres">
                </div>

                <!-- AC-1 + AC-7: Email -->
                <div class="col-12">
                    <label for="email" class="form-label">Email:</label>
                    <div class="input-group">
                        <span class="input-group-text">@</span>
                        <input type="email" class="form-control" id="email"
                               name="email"
                               placeholder="Ingrese su email"
                               required
                               title="Por favor ingrese un email válido">
                    </div>
                </div>

                <!-- AC-7: Dirección -->
                <div class="col-12">
                    <label for="direccion" class="form-label">Dirección:</label>
                    <input type="text" class="form-control" id="direccion"
                           name="direccion"
                           placeholder="Ingrese su dirección completa"
                           required
                           minlength="10"
                           title="La dirección debe tener al menos 10 caracteres">
                </div>

                <!-- AC-7: Celular -->
                <div class="col-12">
                    <label for="celular" class="form-label">Número de teléfono:</label>
                    <input type="tel" class="form-control" id="celular"
                           name="celular"
                           placeholder="Ingrese su número de teléfono"
                           required
                           pattern="[0-9]{10}"
                           title="El número debe contener 10 dígitos">
                </div>

                <!-- AC-1 + AC-7: Contraseña -->
                <div class="col-12">
                    <label for="password" class="form-label">Contraseña:</label>
                    <input type="password" class="form-control" id="password"
                           name="password"
                           placeholder="Cree una contraseña"
                           required
                           minlength="6"
                           title="La contraseña debe tener al menos 6 caracteres">
                </div>

                <!-- AC-8: Botón que se deshabilita tras el primer clic -->
                <div class="col-12">
                    <button class="btn btn-primary btn-lg w-100" type="submit" id="btnGuardar">
                        Guardar
                    </button>
                </div>
            </form>

            <div class="mt-3">
                <p class="text-muted">
                    ¿Ya tienes una cuenta?
                    <a href="/inicioSesion" class="text-decoration-none">Inicia sesión aquí</a>
                </p>
            </div>
        </div>
    </div>
</div>

<!-- AC-8: Deshabilitar botón tras el primer clic -->
<script>
    document.getElementById('formRegistro').addEventListener('submit', function () {
        const btn = document.getElementById('btnGuardar');
        btn.disabled = true;
        btn.textContent = 'Guardando...';
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
