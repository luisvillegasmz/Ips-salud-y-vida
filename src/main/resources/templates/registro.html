<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ES">
<head>
    <meta charset="UTF-8">
    <title>Registro - Pizzas BTS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" type="image/x-icon" href="/img/icon/favicon.ico">
</head>
<body>
    <div class="container text-center mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h1 class="mt-4">🍕 Bienvenido a Pizzas BTS</h1>

                <!-- Mostrar mensajes de error -->
                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <span th:text="${error}"></span>
                </div>

                <!-- Formulario de registro -->
                <form action="/registro" method="post" class="row g-3">
                    
                    <!-- Nombre -->
                    <div class="col-md-6">
                        <label for="nombre" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="nombre" 
                               name="nombre" 
                               placeholder="Ingrese su nombre" 
                               required
                               pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]{2,50}"
                               title="El nombre debe contener solo letras y tener entre 2 y 50 caracteres">
                    </div>
                    
                    <!-- Apellido -->
                    <div class="col-md-6">
                        <label for="apellido" class="form-label">Apellido:</label>
                        <input type="text" class="form-control" id="apellido" 
                               name="apellido" 
                               placeholder="Ingrese su apellido" 
                               required
                               pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]{2,50}"
                               title="El apellido debe contener solo letras y tener entre 2 y 50 caracteres">
                    </div>

                    <!-- Email -->
                    <div class="col-12">
                        <label for="email" class="form-label">Email:</label>
                        <div class="input-group">
                            <span class="input-group-text">@</span>
                            <input type="email" class="form-control" id="email" 
                                   name="email"
                                   placeholder="Ingrese su email" 
                                   required
                                   title="Por favor ingrese un email válido">
                        </div>
                    </div>

                    <!-- Dirección -->
                    <div class="col-12">
                        <label for="direccion" class="form-label">Dirección:</label>
                        <input type="text" class="form-control" id="direccion" 
                               name="direccion"
                               placeholder="Ingrese su dirección completa" 
                               required
                               minlength="10"
                               title="La dirección debe tener al menos 10 caracteres">
                    </div>

                    <!-- Celular -->
                    <div class="col-12">
                        <label for="celular" class="form-label">Número de teléfono:</label>
                        <input type="tel" class="form-control" id="celular" 
                               name="celular"
                               placeholder="Ingrese su número de teléfono" 
                               required
                               pattern="[0-9]{10}"
                               title="El número de teléfono debe contener solo números y tener entre 7 y 15 dígitos">
                    </div>

                    <!-- Contraseña -->
                    <div class="col-12">
                        <label for="password" class="form-label">Contraseña:</label>
                        <input type="password" class="form-control" id="password" 
                               name="password"
                               placeholder="Cree una contraseña" 
                               required
                               minlength="6"
                               title="La contraseña debe tener al menos 6 caracteres">
                    </div>

                    <!-- Botón de registro -->
                    <div class="col-12">
                        <button class="btn btn-primary btn-lg w-100" type="submit">
                            Registrarse y Comenzar a Comprar
                        </button>
                    </div>
                </form>

                <div class="mt-3">
                    <p class="text-muted">
                        ¿Ya tienes una cuenta? 
                        <a href="/inicioSesion" class="text-decoration-none">Inicia sesión aquí</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <footer class="footer-global">
        <p class="footer-title">🍕 Pizzas BTS - Sabor que une al Army</p>
        <p>📍 Dirección: Calle 123 #45-67 | 📞 Tel: +57 123 456 7890</p>
        <p>📧 Email: info@pizzasbts.com | 🌐 Siguenos en redes sociales</p>
        <p class="mb-0">💜 Con cada pedido ayudas a una Army a ver a BTS</p>
    </footer>
</body>
</html>
