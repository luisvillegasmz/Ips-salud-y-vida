<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario | Salud y Vida IPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{/img/LogoSinLetras.png}" type="image/png">
</head>
<body>

<div class="login-wrapper" style="align-items: flex-start; padding-top: 2rem;">
    <div class="card-login card-wide">

        <div class="logo-area">
            <img th:src="@{/img/Logo.png}" src="/img/Logo.png"
                 alt="Logo Salud y Vida IPS">
        </div>

        <p class="login-title">Editar Usuario</p>
        <p class="page-subtitle-text">Modifica los datos básicos del funcionario</p>

        <div th:if="${error}" class="alert-error" role="alert">
            <span th:text="${error}"></span>
        </div>

        <!-- Grid con Tailwind para responsividad -->
        <form th:action="@{/usuarios/editar/{id}(id=${usuario.id})}"
              method="post" id="formEditar"
              class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <div>
                <label for="nombre" class="form-label-ips">
                    Nombre <span class="required">*</span>
                </label>
                <input type="text" class="input-login" id="nombre"
                       name="nombre"
                       th:value="${usuario.nombre}"
                       required
                       pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]{2,50}"
                       title="Solo letras, entre 2 y 50 caracteres">
            </div>

            <div>
                <label for="apellido" class="form-label-ips">Apellido</label>
                <input type="text" class="input-login" id="apellido"
                       name="apellido"
                       th:value="${usuario.apellido}"
                       pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]{2,50}"
                       title="Solo letras, entre 2 y 50 caracteres">
            </div>

            <div class="col-span-1 md:col-span-2">
                <label for="direccion" class="form-label-ips">
                    Dirección <span class="required">*</span>
                </label>
                <input type="text" class="input-login" id="direccion"
                       name="direccion"
                       th:value="${usuario.direccion}"
                       required
                       minlength="10"
                       title="Mínimo 10 caracteres">
            </div>

            <div class="col-span-1 md:col-span-2">
                <label for="celular" class="form-label-ips">Celular</label>
                <input type="tel" class="input-login" id="celular"
                       name="celular"
                       th:value="${usuario.celular}"
                       pattern="[0-9]{10}"
                       title="10 dígitos numéricos">
            </div>

            <div class="col-span-1 md:col-span-2 mt-1">
                <button type="submit"
                        class="btn-acceder btn-acceder-full"
                        id="btnGuardarEdicion">
                    Guardar cambios
                </button>
            </div>

        </form>

        <div class="text-center mt-3">
            <a href="/usuarios" class="link-olvido">← Cancelar y volver</a>
        </div>

    </div>
</div>

<script>
    document.getElementById('formEditar').addEventListener('submit', function () {
        const btn = document.getElementById('btnGuardarEdicion');
        btn.disabled = true;
        btn.textContent = 'Guardando...';
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
