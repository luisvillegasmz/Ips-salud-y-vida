<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario | Salud y Vida IPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{/img/LogoSinLetras.png}" type="image/png">
</head>
<body>

<div class="login-wrapper" style="align-items: flex-start; padding-top: 2rem;">
    <div class="card-login card-wide">

        <div class="logo-area">
            <img th:src="@{/img/Logo.png}" src="/img/Logo.png" alt="Logo Salud y Vida IPS">
        </div>

        <p class="login-title">Registro de usuario</p>
        <p class="page-subtitle-text">Complete los datos del nuevo funcionario</p>

        <div th:if="${error}" class="alert alert-danger py-2 px-3 mb-3"
             style="font-size:0.85rem;" role="alert">
            <span th:text="${error}"></span>
        </div>

        <form action="/registro" method="post" id="formRegistro">
            <div class="row g-3">

                <div class="col-md-6">
                    <label for="nombre" class="form-label-ips">
                        Nombre <span class="required">*</span>
                    </label>
                    <input type="text" class="input-login" id="nombre" name="nombre"
                           placeholder="Ej: Juan Carlos" required
                           pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]{2,50}"
                           title="Solo letras, entre 2 y 50 caracteres">
                </div>

                <div class="col-md-6">
                    <label for="apellido" class="form-label-ips">Apellido</label>
                    <input type="text" class="input-login" id="apellido" name="apellido"
                           placeholder="Ej: Pérez Gómez"
                           pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]{2,50}"
                           title="Solo letras, entre 2 y 50 caracteres">
                </div>

                <div class="col-12">
                    <label for="username" class="form-label-ips">
                        Nombre de usuario <span class="required">*</span>
                    </label>
                    <input type="text" class="input-login" id="username" name="username"
                           placeholder="Ej: jperez" required minlength="4"
                           title="Mínimo 4 caracteres">
                </div>

                <div class="col-12">
                    <label for="email" class="form-label-ips">
                        Email <span class="required">*</span>
                    </label>
                    <div class="input-prefix-wrapper">
                        <span class="prefix">@</span>
                        <input type="email" id="email" name="email"
                               placeholder="correo@dominio.com" required
                               title="Por favor ingrese un email válido">
                    </div>
                </div>

                <div class="col-12">
                    <label for="direccion" class="form-label-ips">
                        Dirección <span class="required">*</span>
                    </label>
                    <input type="text" class="input-login" id="direccion" name="direccion"
                           placeholder="Ej: Calle 10 #20-30, Bogotá" required minlength="10"
                           title="Mínimo 10 caracteres">
                </div>

                <div class="col-12">
                    <label for="celular" class="form-label-ips">
                        Número de teléfono <span class="required">*</span>
                    </label>
                    <input type="tel" class="input-login" id="celular" name="celular"
                           placeholder="Ej: 3001234567" required
                           pattern="[0-9]{10}" title="10 dígitos numéricos">
                </div>

                <div class="col-12">
                    <label for="password" class="form-label-ips">
                        Contraseña <span class="required">*</span>
                    </label>
                    <input type="password" class="input-login" id="password" name="password"
                           placeholder="Mínimo 6 caracteres" required minlength="6"
                           title="La contraseña debe tener al menos 6 caracteres">
                </div>

                <div></div>

                <div class="col-12 mt-1">
                    <button type="submit" class="btn-acceder btn-acceder-full" id="btnGuardar">
                        Guardar
                    </button>
                </div>

            </div>
        </form>

        <div class="text-center mt-3">
            <a href="/inicioSesion" class="link-olvido">¿Ya tienes cuenta? Inicia sesión</a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
