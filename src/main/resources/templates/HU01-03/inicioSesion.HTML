<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Salud y Vida IPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{/img/LogoSinLetras.png}" type="image/png">
</head>
<body>

    <div class="login-wrapper">
        <div class="card-login">

            <!-- Logo -->
            <div class="logo-area">
                <img th:src="@{/img/Logo.png}"
                     src="/img/Logo.png"
                     alt="Logo Salud y Vida IPS">
            </div>

            <!-- Título -->
            <p class="login-title">Iniciar sesión</p>

            <!-- Mensaje de error -->
            <div th:if="${error}" class="alert alert-danger py-2 px-3 mb-3"
                 style="font-size:0.85rem;" role="alert">
                <span th:text="${error}"></span>
            </div>

            <!-- Formulario -->
            <form action="/inicioSesion" method="post">

                <div class="mb-3">
                    <input type="email"
                           class="input-login"
                           id="email"
                           name="email"
                           placeholder="Nombre de usuario *"
                           required
                           title="Por favor ingrese su email">
                </div>

                <div class="mb-4">
                    <input type="password"
                           class="input-login"
                           id="password"
                           name="password"
                           placeholder="Contraseña *"
                           required
                           title="Por favor ingrese su contraseña">
                </div>

                <div class="mb-2">
                    <button type="submit" class="btn-acceder">
                        Acceder
                    </button>
                </div>

            </form>

            <!-- Enlace -->
            <div class="text-center mt-3">
                <a href="#" class="link-olvido">¿Olvidaste la contraseña?</a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
