<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Paciente | Salud y Vida IPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{/img/LogoSinLetras.png}" type="image/png">
</head>
<body>

<div class="login-wrapper" style="align-items: flex-start; padding-top: 2rem;">
    <div class="card-login card-wide">

        <div class="logo-area">
            <img th:src="@{/img/Logo.png}" src="/img/Logo.png"
                 alt="Logo Salud y Vida IPS">
        </div>

        <p class="login-title">Registro de Paciente</p>
        <p class="page-subtitle-text">Complete los datos de identidad del paciente</p>

        <!-- AC-9: Mensaje éxito -->
        <div th:if="${exito}" class="alert-exito">
            <span th:text="${exito}"></span>
        </div>

        <!-- Mensaje error -->
        <div th:if="${error}" class="alert-error">
            ⚠ <span th:text="${error}"></span>
        </div>

        <!-- AC-8: Grid responsivo con Tailwind -->
        <form action="/pacientes/registro" method="post"
              class="grid grid-cols-1 md:grid-cols-2 gap-4"
              id="formPaciente">

            <!-- AC-1: Select tipo de documento -->
            <div class="col-span-1 md:col-span-2">
                <label for="tipoDocumento" class="form-label-ips">
                    Tipo de documento <span class="required">*</span>
                </label>
                <select id="tipoDocumento" name="tipoDocumento"
                        class="select-ips" required>
                    <option value="" disabled selected>-- Seleccione --</option>
                    <option th:each="tipo : ${tiposDocumento}"
                            th:value="${tipo.codigo}"
                            th:text="${tipo.nombre}">
                    </option>
                </select>
            </div>

            <!-- AC-2: Número de documento -->
            <div class="col-span-1 md:col-span-2">
                <label for="numeroDocumento" class="form-label-ips">
                    Número de documento <span class="required">*</span>
                </label>
                <input type="text" class="input-login"
                       id="numeroDocumento" name="numeroDocumento"
                       placeholder="Ej: 1023456789"
                       required
                       title="No puede estar vacío ni ser negativo">
            </div>

            <!-- AC-4: Nombres -->
            <div>
                <label for="nombres" class="form-label-ips">
                    Nombres <span class="required">*</span>
                </label>
                <input type="text" class="input-login"
                       id="nombres" name="nombres"
                       placeholder="Ej: Juan Carlos"
                       required
                       pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]{2,80}">
            </div>

            <!-- AC-4: Apellidos -->
            <div>
                <label for="apellidos" class="form-label-ips">
                    Apellidos <span class="required">*</span>
                </label>
                <input type="text" class="input-login"
                       id="apellidos" name="apellidos"
                       placeholder="Ej: Pérez Gómez"
                       required
                       pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]{2,80}">
            </div>

            <!-- AC-5: Fecha de nacimiento -->
            <div class="col-span-1 md:col-span-2">
                <label for="fechaNacimiento" class="form-label-ips">
                    Fecha de nacimiento <span class="required">*</span>
                </label>
                <input type="date" class="input-login"
                       id="fechaNacimiento" name="fechaNacimiento"
                       required>
            </div>

            <!-- Estado civil -->
            <div class="col-span-1 md:col-span-2">
                <label for="estadoCivil" class="form-label-ips">Estado civil</label>
                <select id="estadoCivil" name="estadoCivil" class="select-ips">
                    <option value="" selected>-- Seleccione --</option>
                    <option th:each="estado : ${estadosCiviles}"
                            th:if="${estado.activo}"
                            th:value="${estado.nombre}"
                            th:text="${estado.nombre}">
                    </option>
                </select>
            </div>

            <!-- Botón -->
            <div class="col-span-1 md:col-span-2 mt-1">
                <button type="submit"
                        class="btn-acceder btn-acceder-full"
                        id="btnGuardar">
                    Registrar paciente
                </button>
            </div>

        </form>

        <div class="text-center mt-3">
            <a href="/dashboard" class="link-olvido">← Volver al Dashboard</a>
        </div>

    </div>
</div>

<!-- AC-9: Deshabilitar botón tras envío -->
<script>
    document.getElementById('formPaciente').addEventListener('submit', function () {
        const btn = document.getElementById('btnGuardar');
        btn.disabled = true;
        btn.textContent = 'Registrando...';
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
