<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios | Salud y Vida IPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{/img/LogoSinLetras.png}" type="image/png">
</head>
<body>

<div class="login-wrapper" style="align-items: flex-start; padding-top: 2rem;">
    <div class="card-login card-full">

        <div class="page-header">
            <div class="page-header-left">
                <img th:src="@{/img/Logo.png}" src="/img/Logo.png" alt="Logo Salud y Vida IPS">
                <div>
                    <p class="page-title">Gestión de Usuarios</p>
                    <p class="page-meta">Administración de cuentas del sistema</p>
                </div>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <a href="/registro" class="btn-nuevo">+ Nuevo usuario</a>
                <a href="/logout" class="btn-cerrar-sesion">Cerrar sesión</a>
            </div>
        </div>

        <div style="overflow-x: auto;">
            <table class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id}"></td>
                        <td th:text="${u.nombre}"></td>
                        <td th:text="${u.apellido}"></td>
                        <td th:text="${u.username}"></td>
                        <td th:text="${u.email}"></td>
                        <td>
                            <span th:if="${u.activo}" class="badge-activo">Activo</span>
                            <span th:unless="${u.activo}" class="badge-inactivo">Inactivo</span>
                        </td>
                        <td style="display:flex; gap:6px; align-items:center;">
                            <a th:href="@{/usuarios/editar/{id}(id=${u.id})}"
                               class="btn-editar">Editar</a>
                            <form th:action="@{/usuarios/inactivar/{id}(id=${u.id})}"
                                  method="post" style="margin:0;" th:if="${u.activo}">
                                <button type="submit" class="btn-inactivar"
                                        onclick="return confirm('¿Confirmas inactivar este usuario?')">
                                    Inactivar
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="7" class="sin-registros">
                            No hay usuarios registrados aún.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="/dashboard" class="btn-volver">← Volver al Dashboard</a>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
