<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ES">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" type="image/x-icon" href="/img/icon/favicon.ico">
</head>
<body>
    <div class="container text-center mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h1 class="mt-4">Iniciar Sesión</h1>

                
                <!-- Mostrar mensajes de error -->
                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <span th:text="${error}"></span>
                </div>

                <!-- Formulario de login -->
                <form action="/inicioSesion" method="post" class="row g-3">
                    <!-- Email -->
                    <div class="col-12">
                        <label for="email" class="form-label">Email:</label>
                        <div class="input-group">
                            <span class="input-group-text">@</span>
                            <input type="email" class="form-control" id="email" 
                                   name="email"
                                   placeholder="Ingrese su email" 
                                   required
                                   title="Por favor ingrese un email válido">
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div class="col-12">
                        <label for="password" class="form-label">Contraseña:</label>
                        <input type="password" class="form-control" id="password" 
                               name="password"
                               placeholder="Ingrese su contraseña" 
                               required
                               title="Por favor ingrese su contraseña">
                    </div>

                    <!-- Botón de login -->
                    <div class="col-12">
                        <button class="btn btn-primary btn-lg w-100" type="submit">
                            Iniciar Sesión
                        </button>
                    </div>
                </form>

                <div class="mt-3">
                    <p class="text-muted">
                        ¿No tienes una cuenta? 
                        <a href="/registro" class="text-decoration-none">Regístrate aquí</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <footer class="footer-global">

    </footer>
</body>
</html>
