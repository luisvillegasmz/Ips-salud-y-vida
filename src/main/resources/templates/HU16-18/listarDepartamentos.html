<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departamentos | Salud y Vida IPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{/img/LogoSinLetras.png}" type="image/png">
</head>
<body>

<div class="login-wrapper" style="align-items: flex-start; padding-top: 2rem;">
    <div class="card-login card-full">

        <div class="page-header">
            <div class="page-header-left">
                <img th:src="@{/img/Logo.png}" src="/img/Logo.png" alt="Logo Salud y Vida IPS">
                <div>
                    <p class="page-title">Departamentos</p>
                    <p class="page-meta">Catálogo de departamentos del sistema</p>
                </div>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <a href="/dashboard" class="btn-volver">← Volver al inicio</a>
                <a href="/logout" class="btn-cerrar-sesion">Cerrar sesión</a>
            </div>
        </div>

        <div th:if="${exito}" class="alert-exito" th:text="${exito}"></div>
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <!-- Formulario -->
        <form th:action="@{/departamentos/guardar}" method="post"
              class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">

            <input type="hidden" name="id" th:value="${editar != null} ? ${editar.id} : ''">

            <div>
                <label class="form-label-ips">Código DANE <span class="required">*</span></label>
                <input type="text" name="codigoDane" class="input-login"
                       th:value="${editar != null} ? ${editar.codigoDane} : ''"
                       placeholder="Ej: 05" required maxlength="10">
            </div>

            <div class="col-span-2">
                <label class="form-label-ips">Nombre <span class="required">*</span></label>
                <input type="text" name="nombre" class="input-login"
                       th:value="${editar != null} ? ${editar.nombre} : ''"
                       placeholder="Ej: Antioquia" required maxlength="100">
            </div>

            <div class="flex items-end gap-2">
                <button type="submit" class="btn-acceder btn-acceder-full"
                        th:text="${editar != null} ? 'Actualizar' : 'Guardar'">
                    Guardar
                </button>
                <a th:if="${editar != null}" href="/departamentos"
                   class="btn-acceder btn-acceder-full"
                   style="background-color:#6b7280; text-align:center;">
                    Cancelar
                </a>
            </div>
        </form>

        <!-- Tabla -->
        <div style="overflow-x: auto;">
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Código DANE</th>
                        <th>Nombre</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="dep : ${departamentos}"
                        th:class="${dep.activo} ? '' : 'table-secondary'">
                        <td th:text="${dep.id}"></td>
                        <td><strong th:text="${dep.codigoDane}"></strong></td>
                        <td th:text="${dep.nombre}"></td>
                        <td>
                            <span th:if="${dep.activo}" class="badge-activo">Activo</span>
                            <span th:unless="${dep.activo}" class="badge-inactivo">Inactivo</span>
                        </td>
                        <td class="td-acciones">
                            <a th:href="@{/departamentos/editar/{id}(id=${dep.id})}"
                               class="btn-editar">Editar</a>
                            <a th:href="@{/departamentos/inactivar/{id}(id=${dep.id})}"
                               class="btn-inactivar"
                               onclick="return confirm('¿Inactivar este departamento?')">
                                Inactivar
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(departamentos)}">
                        <td colspan="5" class="sin-registros">No hay departamentos registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
